<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset=".48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".98"/>
      <stop offset="1" stop-color="#E0F2FE" stop-opacity=".82"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0F172A" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="44" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="190" fill="#A5F3FC" fill-opacity=".16"/>
  <circle cx="170" cy="760" r="260" fill="#C4B5FD" fill-opacity=".18"/>
  <path d="M0 650C170 570 260 700 420 630C590 555 660 720 820 645C980 570 1060 650 1200 585V900H0V650Z" fill="#0F172A" fill-opacity=".13"/>

  <!-- graduation cap -->
  <g filter="url(#shadow)" transform="translate(130 115) rotate(-7 180 120)">
    <path d="M25 105 180 30l155 75-155 75-155-75Z" fill="#111827"/>
    <path d="M82 137v56c58 42 138 42 196 0v-56l-98 47-98-47Z" fill="#1F2937"/>
    <path d="M180 30v152" stroke="#FBBF24" stroke-width="9" stroke-linecap="round"/>
    <circle cx="180" cy="190" r="14" fill="#FBBF24"/>
    <path d="M330 105v80" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- books -->
  <g filter="url(#shadow)" transform="translate(680 410) rotate(-8 180 110)">
    <rect x="30" y="105" width="330" height="62" rx="14" fill="#F59E0B"/>
    <rect x="15" y="52" width="330" height="62" rx="14" fill="#F43F5E"/>
    <rect x="45" y="0" width="330" height="64" rx="14" fill="#22C55E"/>
    <path d="M75 17h265M45 70h265M60 122h260" stroke="#fff" stroke-opacity=".5" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- laptop -->
  <g filter="url(#shadow)" transform="translate(385 530)">
    <rect x="0" y="0" width="310" height="190" rx="18" fill="url(#card)"/>
    <rect x="20" y="20" width="270" height="150" rx="10" fill="#0F172A"/>
    <circle cx="45" cy="45" r="7" fill="#22C55E"/>
    <circle cx="68" cy="45" r="7" fill="#FBBF24"/>
    <circle cx="91" cy="45" r="7" fill="#F43F5E"/>
    <path d="M55 88h150M55 112h110M55 136h180" stroke="#60A5FA" stroke-width="9" stroke-linecap="round"/>
    <path d="M-28 190h366l-28 34H0l-28-34Z" fill="#CBD5E1"/>
  </g>

  <!-- formulas -->
  <g fill="#fff" fill-opacity=".78" font-family="Arial, sans-serif" font-weight="700">
    <text x="910" y="300" font-size="42">Σ</text>
    <text x="1000" y="350" font-size="30">π</text>
    <text x="90" y="450" font-size="32">A = πr²</text>
    <text x="850" y="760" font-size="28">f(x) = x² + 2x + 1</text>
  </g>
  <g fill="#fff" fill-opacity=".45">
    <circle cx="1030" cy="520" r="9"/><circle cx="1080" cy="520" r="5"/><circle cx="1120" cy="560" r="8"/>
    <circle cx="260" cy="350" r="7"/><circle cx="300" cy="320" r="4"/><circle cx="330" cy="380" r="9"/>
  </g>
</svg>
